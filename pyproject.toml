[project]
name = "tessaract"
version = "0.1.2"
description = "Provider-agnostic SDK for building AI agents natively"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3"   
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { "name" = "Jennifer Umoke" },
]
[project.optional-dependencies]
openai = [
    "openai>=2.45.0",
]


[project.urls]
Repository = "https://github.com/jenniferumoke/tessaract"
Issues = "https://github.com/jenniferumoke/tessaract/issues"
Documentation = "https://jenniferumoke.github.io/tessaract/"

[build-system]
requires = ["uv_build>=0.12.13, <0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "-m", "not live"]
markers = [
    "live: calls the real APIs (requires a Provider API key.)"
]

