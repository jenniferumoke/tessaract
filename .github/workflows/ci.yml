name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.2

      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check the built wheel with no extras, then with each extra on its own
        run: |
          wheel="$(printf '%s\n' dist/*.whl)"

          python -m venv .venv-none
          .venv-none/bin/python -m pip install "$wheel"
          .venv-none/bin/python -I -c 'import tessaract; print("Installed package works with no extras")'

          for extra in openai:OpenAIProvider anthropic:AnthropicProvider openrouter:OpenRouterProvider; do
            name="${extra%%:*}"
            provider="${extra##*:}"
            python -m venv ".venv-$name"
            ".venv-$name/bin/python" -m pip install "$wheel[$name]"
            ".venv-$name/bin/python" -I -c "from tessaract import $provider, Tessaract; client = Tessaract({'p': $provider(api_key='test')}); print('Installed package works with $name:', client.__class__.__name__)"
          done
  
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.2
      
      - name: Install packages with test dependencies
        run: python -m pip install -e ".[openai,anthropic,openrouter]" pytest pytest-cov

      - name: Run tests (live API tests are excluded by default)
        run: pytest --cov=tessaract --cov-report=term-missing

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip==26.2.2

      - name: Install packages with type checker
        run: python -m pip install -e ".[openai,anthropic,openrouter]" pyright==1.1.414

      - name: Type check the library, examples and public API usage (what Pylance reports in editors)
        run: pyright src examples tests/typing
