site_name: Tessaract
site_description: Documentation for the Tessaract Python SDK
site_url: https://tessaractai.com/
repo_url: https://github.com/jenniferumoke/tessaract
repo_name: jenniferumoke/tessaract
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/tessaract-symbol.webp
  favicon: assets/images/favicon.png
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/branding.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Building an agent: building-an-agent.md
  - Examples: examples.md
  - Guides:
      - Tool calling: tool-calling.md
      - Provider tools: provider-tools.md
      - Reasoning: reasoning.md
      - Streaming: streaming.md
  - API reference: api-reference.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
