site_name: Tessaract
site_description: Documentation for the Tessaract Python SDK
site_url: https://jenniferumoke.github.io/tessaract/
repo_url: https://github.com/jenniferumoke/tessaract
repo_name: jenniferumoke/tessaract
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Building an agent: building-an-agent.md
  - Guides:
      - Tool calling: tool-calling.md
      - Reasoning: reasoning.md
      - Streaming: streaming.md
  - API reference: api-reference.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
